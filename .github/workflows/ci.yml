name: CI

# 第一步：跑现有门禁（type-check / check:terms / lint / test / build）。
# 第二步（后续）：再加真实 ES 作业，核验 9.5.6 + analysis-smartcn + 就绪探测 + 测试库隔离。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.1
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # 测试与迁移都通过 .env 同源的 readConfig 读这些变量；CI 不提供 .env。
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ci-root-password
      DB_NAME: shop_homework
      PORT: '3001'
      ES_URL: http://127.0.0.1:9201
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm check:terms
      - run: pnpm lint
      # 默认套件不依赖 Elasticsearch（global-setup 只建测试库），ES_URL 指向未监听端口即可。
      - run: pnpm test
      - run: pnpm build
  # 第二步（retro P1）：真实 Elasticsearch 作业。
  # 独立的 MySQL service：两套测试各用各的容器库，互不干扰（逻辑库名仍为 shop_homework_test）。
  search-es:
    runs-on: ubuntu-latest
    needs: checks
    services:
      mysql:
        image: mysql:8.1
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9201:9200
        options: >-
          --health-cmd="curl -fsS http://localhost:9200/"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=40
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ci-root-password
      DB_NAME: shop_homework
      PORT: '3001'
      ES_URL: http://127.0.0.1:9201
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # 插件必须与 ES 版本严格一致；装完重启容器才会加载。
      - name: 安装 analysis-smartcn 并等待就绪
        run: |
          set -euo pipefail
          docker exec "${{ job.services.elasticsearch.id }}" bin/elasticsearch-plugin install --batch analysis-smartcn
          docker restart "${{ job.services.elasticsearch.id }}"
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9201/ -o /tmp/es-root.json; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then echo "Elasticsearch 未在 180s 内就绪"; exit 1; fi
          version=$(node -e "const d=require('/tmp/es-root.json'); process.stdout.write(d.version.number)")
          echo "ES 版本：$version"
          [ "$version" = "9.5.6" ] || { echo "ES 版本不是 9.5.6：$version"; exit 1; }
          curl -fsS "http://127.0.0.1:9201/_cat/plugins" | tee /tmp/es-plugins.txt
          grep -q 'analysis-smartcn' /tmp/es-plugins.txt || { echo "缺少 analysis-smartcn 插件"; exit 1; }
      - run: pnpm test:es
