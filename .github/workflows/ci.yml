name: CI

# 第一步：跑现有门禁（type-check / check:terms / test / build）。
# 第二步（后续）：再加真实 ES 作业，核验 9.5.6 + analysis-smartcn + 就绪探测 + 测试库隔离。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.1
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # 测试与迁移都通过 .env 同源的 readConfig 读这些变量；CI 不提供 .env。
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ci-root-password
      DB_NAME: shop_homework
      PORT: '3001'
      ES_URL: http://127.0.0.1:9201
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm check:terms
      # 默认套件不依赖 Elasticsearch（global-setup 只建测试库），ES_URL 指向未监听端口即可。
      - run: pnpm test
      - run: pnpm build
